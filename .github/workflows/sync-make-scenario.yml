name: Sync Make scenario

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pull = copy the current Make Blueprint into GitHub; apply = send the GitHub Blueprint to Make"
        required: true
        default: "pull"
        type: choice
        options:
          - pull
          - apply
      scenario_id:
        description: "Make scenario ID"
        required: true
        default: "7422230"
        type: string
  push:
    paths:
      - "make/blueprints/*.json"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      MAKE_API_BASE: https://eu1.make.com/api/v2
      MAKE_TEAM_ID: "2518622"
      MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
      SCENARIO_ID: ${{ inputs.scenario_id || '7422230' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Make token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MAKE_API_TOKEN}" || { echo "MAKE_API_TOKEN secret is missing."; exit 1; }

      - name: Pull current Make Blueprint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'pull' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p make/blueprints

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Token ${MAKE_API_TOKEN}" \
            -H "Accept: application/json" \
            "${MAKE_API_BASE}/scenarios/${SCENARIO_ID}/blueprint" \
            -o /tmp/blueprint-response.json

          python - <<'PY'
          import json, os, pathlib

          scenario_id = os.environ["SCENARIO_ID"]
          raw = json.loads(pathlib.Path("/tmp/blueprint-response.json").read_text())

          # Make returns the blueprint payload under "blueprint" in the API response.
          blueprint = raw.get("blueprint", raw)

          if isinstance(blueprint, str):
              blueprint = json.loads(blueprint)

          out = pathlib.Path(f"make/blueprints/scenario-{scenario_id}.json")
          out.write_text(json.dumps(blueprint, ensure_ascii=False, indent=2) + "\n")
          print(f"Saved {out}")
          PY

      - name: Commit pulled Blueprint
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'pull' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add make/blueprints/
          if git diff --cached --quiet; then
            echo "Blueprint is already up to date."
            exit 0
          fi

          git commit -m "chore: sync Make scenario blueprint"
          git push

      - name: Verify scenario is inactive before applying
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply') || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Token ${MAKE_API_TOKEN}" \
            -H "Accept: application/json" \
            "${MAKE_API_BASE}/scenarios/${SCENARIO_ID}" \
            -o /tmp/scenario.json

          python - <<'PY'
          import json, pathlib, os, sys
          data = json.loads(pathlib.Path("/tmp/scenario.json").read_text())
          scenario = data.get("scenario", data)
          print("Scenario:", scenario.get("name"))
          print("Active:", scenario.get("isActive"))
          if scenario.get("isActive"):
              print("Refusing to apply Blueprint while the scenario is active.")
              sys.exit(1)
          PY

      - name: Apply GitHub Blueprint to Make
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply') || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail

          BLUEPRINT_FILE="make/blueprints/scenario-${SCENARIO_ID}.json"
          test -f "${BLUEPRINT_FILE}" || { echo "Missing ${BLUEPRINT_FILE}"; exit 1; }

          python - <<'PY'
          import json, os, pathlib, urllib.request

          token = os.environ["MAKE_API_TOKEN"]
          base = os.environ["MAKE_API_BASE"]
          scenario_id = os.environ["SCENARIO_ID"]
          blueprint_file = pathlib.Path(f"make/blueprints/scenario-{scenario_id}.json")

          blueprint = json.loads(blueprint_file.read_text())
          payload = json.dumps({"blueprint": json.dumps(blueprint, ensure_ascii=False, separators=(",", ":"))}).encode()

          req = urllib.request.Request(
              f"{base}/scenarios/{scenario_id}",
              data=payload,
              method="PATCH",
              headers={
                  "Authorization": f"Token {token}",
                  "Accept": "application/json",
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(req) as response:
              body = response.read().decode()
              print(body)
          PY

      - name: Confirm applied scenario is still inactive
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply') || github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Token ${MAKE_API_TOKEN}" \
            -H "Accept: application/json" \
            "${MAKE_API_BASE}/scenarios/${SCENARIO_ID}" \
            -o /tmp/scenario-after.json

          python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("/tmp/scenario-after.json").read_text())
          scenario = data.get("scenario", data)
          print("Make scenario:", scenario.get("name"))
          print("Active after sync:", scenario.get("isActive"))
          if scenario.get("isActive"):
              print("Safety check failed: scenario became active unexpectedly.")
              sys.exit(1)
          PY
