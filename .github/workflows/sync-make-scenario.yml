name: Sync Make scenario

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-make-scenario.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "pull = Make -> GitHub; apply = GitHub -> Make"
        required: true
        default: "pull"
        type: choice
        options:
          - pull
          - apply
      scenario_id:
        description: "Make scenario ID"
        required: true
        default: "7422230"
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      MAKE_API_BASE: https://eu1.make.com/api/v2
      MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
      SCENARIO_ID: ${{ inputs.scenario_id || '7422230' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Make token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MAKE_API_TOKEN}" || { echo "MAKE_API_TOKEN secret is missing."; exit 1; }

      - name: Pull current Make Blueprint
        if: ${{ inputs.mode == 'pull' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p make/blueprints

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Token ${MAKE_API_TOKEN}" \
            -H "Accept: application/json" \
            "${MAKE_API_BASE}/scenarios/${SCENARIO_ID}/blueprint" \
            -o /tmp/blueprint-response.json

          python - <<'PY'
          import json, os, pathlib

          scenario_id = os.environ["SCENARIO_ID"]
          raw = json.loads(pathlib.Path("/tmp/blueprint-response.json").read_text())
          response = raw.get("response", raw)
          blueprint = response.get("blueprint", response)

          if isinstance(blueprint, str):
              blueprint = json.loads(blueprint)

          if not isinstance(blueprint, dict) or "flow" not in blueprint:
              raise SystemExit("Make response did not contain a valid blueprint with a flow.")

          out = pathlib.Path(f"make/blueprints/scenario-{scenario_id}.json")
          out.write_text(json.dumps(blueprint, ensure_ascii=False, indent=2) + "\n")
          print(f"Saved normalized Blueprint: {out}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "make/blueprints/scenario-${SCENARIO_ID}.json"

          if git diff --cached --quiet; then
            echo "Blueprint is already up to date."
          else
            git commit -m "chore: sync Make scenario blueprint"
            git push
          fi

      - name: Validate Blueprint exists
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          BLUEPRINT_FILE="make/blueprints/scenario-${SCENARIO_ID}.json"
          test -f "${BLUEPRINT_FILE}" || { echo "Missing ${BLUEPRINT_FILE}"; exit 1; }

          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(f"make/blueprints/scenario-{os.environ['SCENARIO_ID']}.json")
          data = json.loads(p.read_text())
          if not isinstance(data, dict) or "flow" not in data:
              raise SystemExit("Blueprint file is not normalized.")
          print(f"Valid Blueprint: {p}")
          PY

      - name: Verify scenario is inactive before applying
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Token ${MAKE_API_TOKEN}" \
            -H "Accept: application/json" \
            "${MAKE_API_BASE}/scenarios/${SCENARIO_ID}" \
            -o /tmp/scenario.json

          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("/tmp/scenario.json").read_text())
          scenario = data.get("scenario", data)
          print("Scenario:", scenario.get("name"))
          print("Active:", scenario.get("isActive"))
          if scenario.get("isActive"):
              raise SystemExit("Refusing to apply while the Make scenario is active.")
          PY

      - name: Pull live Make Blueprint and sanitize it
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error -H "Authorization: Token ${MAKE_API_TOKEN}" -H "Accept: application/json" "${MAKE_API_BASE}/scenarios/${SCENARIO_ID}/blueprint" -o /tmp/live-blueprint-response.json

          python - <<'PY'
          import json, pathlib

          raw = json.loads(pathlib.Path("/tmp/live-blueprint-response.json").read_text())
          response = raw.get("response", raw)
          blueprint = response.get("blueprint", response)
          if isinstance(blueprint, str):
              blueprint = json.loads(blueprint)
          if not isinstance(blueprint, dict) or "flow" not in blueprint:
              raise SystemExit("Live Make response did not contain a valid blueprint with a flow.")

          removed = 0
          def sanitize(value):
              global removed
              if isinstance(value, dict):
                  if "role" in value and "content" in value and "contentType" in value:
                      value.pop("contentType", None)
                      removed += 1
                  for child in value.values():
                      sanitize(child)
              elif isinstance(value, list):
                  for child in value:
                      sanitize(child)
          sanitize(blueprint)
          pathlib.Path("/tmp/live-blueprint.json").write_text(json.dumps(blueprint, ensure_ascii=False, separators=(",", ":")))
          print(f"Live Blueprint loaded and sanitized; removed {removed} invalid message contentType fields.")
          PY

      - name: Apply live sanitized Blueprint to Make
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          token = os.environ["MAKE_API_TOKEN"]
          base = os.environ["MAKE_API_BASE"]
          scenario_id = os.environ["SCENARIO_ID"]
          blueprint = json.loads(pathlib.Path("/tmp/live-blueprint.json").read_text())
          payload = json.dumps({"blueprint": json.dumps(blueprint, ensure_ascii=False, separators=(",", ":"))}, ensure_ascii=False).encode()
          req = urllib.request.Request(f"{base}/scenarios/{scenario_id}?confirmed=true", data=payload, method="PATCH", headers={"Authorization": f"Token {token}", "Accept": "application/json", "Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req) as response:
                  print(response.read().decode())
          except urllib.error.HTTPError as exc:
              print(f"Make API returned HTTP {exc.code}:")
              print(exc.read().decode("utf-8", errors="replace"))
              raise
          PY

      - name: Confirm scenario remains inactive
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Token ${MAKE_API_TOKEN}" \
            -H "Accept: application/json" \
            "${MAKE_API_BASE}/scenarios/${SCENARIO_ID}" \
            -o /tmp/scenario-after.json

          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("/tmp/scenario-after.json").read_text())
          scenario = data.get("scenario", data)
          print("Scenario:", scenario.get("name"))
          print("Active after apply:", scenario.get("isActive"))
          if scenario.get("isActive"):
              raise SystemExit("Safety check failed: scenario became active unexpectedly.")
          PY
